# Releases JARVIS Desk (ADR 0010): push a tag desk-vX.Y.Z and this builds the ad-hoc-signed arm64
# .dmg on a macOS runner and publishes it as a GitHub Release. The repo is public, so no token setup.
name: Release JARVIS Desk

on:
  push:
    tags: ["desk-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 20
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Version from the tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#desk-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cd desk && npm version --no-git-tag-version "$VERSION" >/dev/null
      - name: Build the .dmg
        working-directory: desk
        run: npm run dist:mac
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" desk/release/*.dmg \
            --title "JARVIS Desk ${{ steps.version.outputs.version }}" \
            --generate-notes \
            --notes "Install: download the .dmg, drag JARVIS Desk to Applications, then right-click it → Open the first time. Full guide: docs/desk-install.md"
