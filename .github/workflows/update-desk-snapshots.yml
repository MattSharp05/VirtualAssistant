name: Update desk visual snapshots (one-off)
# Temporary helper (JD-83): regenerates desk/e2e/__snapshots__ baselines inside the same
# mcr.microsoft.com/playwright:v1.64.1-noble image the desk-visual CI job uses, and pushes the
# result straight to the branch that triggered it. Removed once it's done its job.
on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Playwright spec file (relative to desk/e2e/web), or 'all'"
        default: "todo.spec.ts"
        required: false

permissions:
  contents: write

jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - name: Update snapshots
        working-directory: desk
        env: { HOME: /root, VISUAL: "1" }
        run: |
          SPEC="${{ github.event.inputs.spec }}"
          if [ "$SPEC" = "all" ] || [ -z "$SPEC" ]; then
            npx playwright test --project=web-desktop --update-snapshots
          else
            npx playwright test --project=web-desktop "$SPEC" --update-snapshots
          fi
      - name: Commit and push updated snapshots
        run: |
          git config user.name "jarvis-snapshot-bot"
          git config user.email "jarvis-snapshot-bot@users.noreply.github.com"
          git add desk/e2e/__snapshots__
          if git diff --cached --quiet; then
            echo "No snapshot changes."
          else
            git commit -m "chore: update desk visual snapshots"
            git push
          fi
