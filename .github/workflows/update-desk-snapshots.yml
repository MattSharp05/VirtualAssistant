name: Update desk visual snapshots (one-off)
# Temporary helper (JD-83): regenerates desk/e2e/__snapshots__ baselines inside the same
# mcr.microsoft.com/playwright:v1.64.1-noble image the desk-visual CI job uses, and pushes the
# result straight to the branch that triggered it. Removed once it's done its job.
# workflow_dispatch would need this file on the default branch first (GitHub only looks there for
# dispatchable workflows), which this PR's rules don't allow pushing to directly — so this instead
# triggers on a push to this exact branch, which Actions reads from the branch itself.
on:
  push:
    branches: [jd-83-todo-hub]

permissions:
  contents: write

jobs:
  update-snapshots:
    # Guards against the bot's own push re-triggering this (it's a push-triggered workflow).
    if: github.event.head_commit.author.name != 'jarvis-snapshot-bot'
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - name: Update snapshots
        working-directory: desk
        env: { HOME: /root, VISUAL: "1" }
        run: npx playwright test --project=web-desktop todo.spec.ts --update-snapshots
      - name: Commit and push updated snapshots
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" config user.name "jarvis-snapshot-bot"
          git -C "$GITHUB_WORKSPACE" config user.email "jarvis-snapshot-bot@users.noreply.github.com"
          git -C "$GITHUB_WORKSPACE" add desk/e2e/__snapshots__
          if git -C "$GITHUB_WORKSPACE" diff --cached --quiet; then
            echo "No snapshot changes."
          else
            git -C "$GITHUB_WORKSPACE" commit -m "chore: update desk visual snapshots"
            git -C "$GITHUB_WORKSPACE" push
          fi
