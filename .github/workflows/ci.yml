# Two levels (docs/TDD.md → Testing strategy): a fast PR gate (every job ≤ 5 min) and the full
# suite on main. The macOS .dmg build runs on PRs only when the Desk's native code changes.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Electron is only needed on the macOS job; everywhere else skip the ~100 MB binary.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      desk_native: ${{ steps.filter.outputs.desk_native }}
      desk_ui: ${{ steps.filter.outputs.desk_ui }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - "**"
              - "!docs/**"
              - "!**/*.md"
            desk_ui:
              - "desk/renderer/**"
              - "desk/e2e/**"
              - "desk/playwright.config.ts"
              - "desk/vite.config.ts"
              - "shared/**"
            desk_native:
              - "desk/main/**"
              - "desk/preload/**"
              - "desk/package.json"
              - "desk/electron-builder.yml"
              - "desk/build/**"
              - "package-lock.json"
              - ".github/workflows/ci.yml"

  server:
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test

  desk-check:
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run -w @jarvis/desk lint
      - run: npm run -w @jarvis/desk typecheck
      - run: npm run -w @jarvis/desk test
      - run: npm run -w @jarvis/desk build

  # The Desk UI in Chromium against the web build + mock scenarios (desk/e2e/web), in Playwright's
  # own image so browsers and fonts match the visual baselines.
  desk-e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - run: npx playwright test --project=web-desktop --shard=${{ matrix.shard }}/2 --pass-with-no-tests
        working-directory: desk
        env: { HOME: /root }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desk-e2e-report-${{ matrix.shard }}
          path: desk/playwright-report
          retention-days: 7

  # Visual snapshots (0.2% tolerance) when the UI changes, and on main.
  desk-visual:
    needs: changes
    if: needs.changes.outputs.desk_ui == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - run: npx playwright test --project=web-desktop
        working-directory: desk
        env: { HOME: /root, VISUAL: "1" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desk-visual-diff
          path: desk/test-results
          retention-days: 7

  desk-mac:
    needs: changes
    if: needs.changes.outputs.desk_native == 'true' || github.event_name == 'push'
    runs-on: macos-14
    timeout-minutes: 15
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # The Electron smoke test needs the real binary here.
      ELECTRON_SKIP_BINARY_DOWNLOAD: ""
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build the .dmg
        working-directory: desk
        run: |
          npm version --no-git-tag-version "0.0.0-ci.${GITHUB_RUN_NUMBER}" >/dev/null
          npm run dist:mac
      - name: Upload the .dmg
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Desk-${{ github.sha }}-arm64
          path: desk/release/*.dmg
          retention-days: 14
      - name: Electron smoke test (demo-day scenario, idle RSS/CPU in the summary)
        working-directory: desk
        run: npx playwright test --project=electron
      - name: Upload the smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-smoke-${{ github.sha }}
          path: desk/test-results
          retention-days: 14
      - name: Summary
        run: |
          echo "### JARVIS Desk .dmg" >> "$GITHUB_STEP_SUMMARY"
          echo "Download: ${{ steps.upload.outputs.artifact-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "First launch: right-click the app → Open (it isn't notarised)." >> "$GITHUB_STEP_SUMMARY"
