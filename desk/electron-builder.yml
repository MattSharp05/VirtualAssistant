# JARVIS Desk packaging (ADR 0010): an ad-hoc-signed arm64 .dmg, no Apple developer account, and a .zip
# of the same app for automatic updates (JD-74; release.yml adds latest-mac.json beside them).
appId: ai.jarvis.desk
productName: JARVIS Desk
directories:
  output: release
  buildResources: build
files:
  - dist-electron/**
  - renderer/dist/**
  - package.json
  # Voice's native modules (dependencies, ADR 0004) ship binaries for every platform; keep the Mac's.
  - "!**/node_modules/onnxruntime-node/bin/napi-v*/{linux,win32}/**"
  - "!**/node_modules/@picovoice/pvrecorder-node/lib/{linux,windows,raspberry-pi}/**"
  - "!**/node_modules/@picovoice/porcupine-node/lib/{linux,windows,raspberry-pi}/**"
  - "!**/node_modules/@picovoice/porcupine-node/resources/keyword_files/{linux,windows,raspberry-pi}/**"
  - "!**/node_modules/@picovoice/porcupine-node/{src,test}/**"
  - "!**/node_modules/uiohook-napi/prebuilds/{linux,win32}-*/**"
  - "!**/node_modules/uiohook-napi/{libuiohook,src}/**"
asar: true
# Native code can't load from inside the asar.
asarUnpack:
  - "**/*.node"
  - "**/*.dylib"
  # Porcupine's model and keyword files are read by its native code (JD-43).
  - "**/node_modules/@picovoice/porcupine-node/lib/common/**"
  - "**/node_modules/@picovoice/porcupine-node/resources/keyword_files/mac/**"
  # Camera hands' MediaPipe runtime and model (JD-42), loaded by the overlay renderer.
  - "renderer/dist/mediapipe/**"
# whisper-cli (arm64, Metal), built by CI into vendor/whisper (JD-24); looked up in Resources/whisper.
extraResources:
  - from: vendor/whisper
    to: whisper
    filter:
      - whisper-cli
  # The wake word's chime (JD-43), played with afplay.
  - from: resources/chime.wav
    to: chime.wav
mac:
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  category: public.app-category.productivity
  # The zip's name (JD-74); dmg.artifactName below overrides it for the .dmg.
  artifactName: JARVIS-Desk-${version}-${arch}-mac.${ext}
  # "-" = ad-hoc signature: required for arm64 apps to launch; Gatekeeper still asks once (right-click → Open).
  identity: "-"
  hardenedRuntime: false
  # No LSUIElement (JD-62): a normal app with a Dock icon; Settings → Show in Dock hides it at runtime.
  extendInfo:
    NSMicrophoneUsageDescription: JARVIS listens when you say "Jarvis" or double-tap the right Option key.
    NSCameraUsageDescription: JARVIS uses the camera only when Camera hands is on, to track your hands.
dmg:
  artifactName: JARVIS-Desk-${version}-${arch}.${ext}
