services:
  jarvis:
    build: .
    env_file: .env
    ports:
      # Dashboard on http://localhost:8080. Bound to this machine only; on a VPS put it behind
      # HTTPS and set DASHBOARD_PASSWORD before exposing it.
      - "127.0.0.1:8080:8080"
    volumes:
      - jarvis-data:/data
    # JARVIS idles around 100 MB and briefly adds ~200 MB per claude CLI call. The cap keeps a
    # leak or runaway process from ever eating the host's memory.
    mem_limit: 512m
    restart: unless-stopped

volumes:
  jarvis-data:
